name: C10 GOV002 Routed Approval Delegation Withdrawal PG17
on:
  pull_request:
    paths:
      - 'internal/enterprise-sql/c10_a008_routing_delegation_withdrawal_v1.sql'
      - 'tests/c10_a008_routing_delegation_withdrawal_e2e.sql'
      - 'tests/c10_a008_routed_concurrency.sh'
      - '.github/workflows/c10-gov002-route-delegate.yml'
      - 'internal/enterprise-sql/c10_a008_typed_approval_v1.sql'
      - 'internal/enterprise-sql/c10_a008_scoped_inbox_v1.sql'
  push:
    branches:
      - 'feature/c10-gov002-*'
    paths:
      - 'internal/enterprise-sql/c10_a008_routing_delegation_withdrawal_v1.sql'
      - 'tests/c10_a008_routing_delegation_withdrawal_e2e.sql'
      - '.github/workflows/c10-gov002-route-delegate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo_only
          POSTGRES_DB: core10_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: core10_demo
      PGUSER: postgres
      PGPASSWORD: demo_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL CLI
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision disposable demo principals
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL
      - name: Install parent schema and existing GOV002 build
        run: |
          psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_demo_backend.sql
          psql -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
          psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a008_atomic_approval_draft.sql
          psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a008_typed_approval_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/c10_a008_typed_approval_e2e.sql
          psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a008_scoped_inbox_v1.sql
          psql -v ON_ERROR_STOP=1 -f tests/c10_a008_scoped_inbox_e2e.sql
      - name: Install routed transitions and bounded delegations
        run: psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a008_routing_delegation_withdrawal_v1.sql
      - name: Verify stages, authorization, revoke, idempotency, withdrawal and zero posting
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a008_routing_delegation_withdrawal_e2e.sql
      - name: Verify two real concurrent PostgreSQL sessions cannot double-vote
        run: bash tests/c10_a008_routed_concurrency.sh
