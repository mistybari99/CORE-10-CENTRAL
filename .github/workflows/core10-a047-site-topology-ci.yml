name: CORE10 A047 Business Site Grouping PostgreSQL CI
on:
  push:
    branches: ['chatgpt/c10-a047-*']
    paths:
      - 'internal/enterprise-sql/c10_a047_site_topology_v1.sql'
      - 'tests/c10_a047_site_topology_e2e.sql'
      - 'core10-site-topology*'
      - 'tests/c10_a047_topology_client.test.js'
      - 'tests/fixtures/c10_a047_topology_browser_mock.js'
      - 'tests/e2e/core10-a047-site-topology-browser.js'
      - '.github/workflows/core10-a047-site-topology-ci.yml'
  pull_request:
    paths:
      - 'internal/enterprise-sql/c10_a047_site_topology_v1.sql'
      - 'tests/c10_a047_site_topology_e2e.sql'
      - 'core10-site-topology*'
      - 'tests/c10_a047_topology_client.test.js'
      - 'tests/fixtures/c10_a047_topology_browser_mock.js'
      - 'tests/e2e/core10-a047-site-topology-browser.js'
      - '.github/workflows/core10-a047-site-topology-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-topology-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_a047_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: a047_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_a047_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: core10_a047_ci
      PGUSER: postgres
      PGPASSWORD: a047_disposable_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare entirely disposable tenant and role fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_demo_backend.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a020_business_setup_v1.sql
      - name: Install isolated canonical business site group engine
        run: psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a047_site_topology_v1.sql
      - name: Verify grouping, site/location identity, idempotency, role and independent tenant negative
        run: psql -X -v ON_ERROR_STOP=1 -f tests/c10_a047_site_topology_e2e.sql
      - name: Confirm existing baseline IDs are unchanged
        run: |
          [ "$(psql -X -At -c 'SELECT count(*) FROM c10_demo.sites WHERE id IN(1001,1002,1003,2001)')" = 4 ]
          [ "$(psql -X -At -c 'SELECT count(*) FROM c10_demo.stock_locations WHERE id IN(5001,5002,5003,6001)')" = 4 ]
      - name: Signed-session RPC client and negative contract suite
        run: node tests/c10_a047_topology_client.test.js
      - name: Install pinned Chromium for responsive real DOM checks
        run: |
          mkdir -p "$RUNNER_TEMP/core10-playwright" && cd "$RUNNER_TEMP/core10-playwright"
          npm init -y >/dev/null
          npm install -D playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/core10-playwright/node_modules" >> "$GITHUB_ENV"
      - name: 390px / 1440px grouped Owner UI and CRUD flow in isolated signed fixture
        run: node tests/e2e/core10-a047-site-topology-browser.js
      - name: Honest release boundary
        run: |
          echo 'A047 PASS: isolated PG17 signed-claim SIMULATION only; no real GoTrue, no production Supabase SQL, no stock/finance activation.'
