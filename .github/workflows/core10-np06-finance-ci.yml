name: core10-np06-finance-ci
on:
  push:
    branches:
      - build/chatgpt-np06-finance
    paths:
      - "internal/migrations/**"
      - "tests/migrations/**"
      - ".github/workflows/core10-np06-finance-ci.yml"
  pull_request:
    paths:
      - "internal/migrations/**"
      - "tests/migrations/**"
      - ".github/workflows/core10-np06-finance-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: np06_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: np06_disposable
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create only disposable API roles
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
          END \$\$;"
      - name: Static migration contract
        run: node --test tests/migrations/migration-contract.test.js
      - name: Full migrations Up / Down / Up / idempotent reapply on PG17
        run: bash tests/migrations/run-updownup.sh
      - name: Verify exact migration head and registry
        run: |
          internal/migrations/run.sh up
          psql -X -v ON_ERROR_STOP=1 -f tests/migrations/control-registry-check.sql
          bash tests/migrations/control-registry-evidence.sh
      - name: Synthetic canonical Finance E2E and negative security tests
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np06-finance-e2e.sql
      - name: Synthetic immutable reversal and governance security checks
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np06-finance-reversal-e2e.sql
      - name: Independent-session journal posting race and idempotency
        run: bash tests/migrations/np06-finance-race.sh
      - name: Independent-session reversal race and one canonical audit receipt
        run: bash tests/migrations/np06-finance-reversal-race.sh
      - name: Standalone reversal race in a separately migrated empty PostgreSQL 17 database
        run: |
          createdb np06_rev_standalone
          PGDATABASE=np06_rev_standalone internal/migrations/run.sh up
          PGDATABASE=np06_rev_standalone bash tests/migrations/np06-finance-reversal-race.sh
          test "$(PGDATABASE=np06_rev_standalone psql -X -At -c "SELECT count(*) FROM core10.finance_reversals_v1 WHERE business_id=9711")" = "1"
          test "$(PGDATABASE=np06_rev_standalone psql -X -At -c "SELECT count(*) FROM core10.finance_journals_v1 WHERE business_id=9711 AND status='posted'")" = "2"
          echo NP06_REVERSAL_STANDALONE_FRESH_DB_PASS
      - name: Explicit 0400 and 0401 immutable history and audit rollback guards
        run: bash tests/migrations/np06-finance-rollback-boundary.sh

  np01-compat-pg17:
    name: "F2 + NP01 0114 PR111 compatibility (disposable PG17)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: np06_compat_disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: np06_compat_disposable
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the reviewed NP01 revision and prepare the Finance test tree
        run: |
          bash tests/migrations/np06-np01-compat-tree.test.sh
          bash tests/migrations/np06-np01-compat-tree.sh 69143ffb82667b6f81b3667288af54a86b597698
      - name: Create disposable canonical API roles
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
          END \$\$;"
      - name: NP01 Finance and migration static contracts
        run: |
          node --test tests/migrations/migration-contract.test.js
          node --test tests/migrations/np01-*.test.js
          node --test tests/setup001/setup-profile-engine.test.cjs tests/gov003/np01-canonical-csv.test.mjs
      - name: Combined NP01 0110-0114 and Finance 0400-0401 Up Down Up
        run: |
          bash tests/migrations/run-updownup.sh
          internal/migrations/run.sh up
          psql -X -v ON_ERROR_STOP=1 -f tests/migrations/control-registry-check.sql
          bash tests/migrations/control-registry-evidence.sh
      - name: Combined NP01 Approval Owner Control Master and Finance transaction E2E
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np01-unbound-rpc-fence.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np01-control-submit-delegation-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np01-control-route-stages-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np01-control-site-provision-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np01-control-gov003-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np01-control-threshold-exception-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np02-master-rpc-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np06-finance-e2e.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np06-finance-reversal-e2e.sql
      - name: Combined NP01 Finance real independent-session races
        run: |
          bash tests/migrations/np01-control-route-concurrency.sh
          bash tests/migrations/np01-control-site-provision-concurrency.sh
          bash tests/migrations/np01-control-gov003-concurrency.sh
          bash tests/migrations/np01-control-threshold-exception-concurrency.sh
          bash tests/migrations/np06-finance-race.sh
          bash tests/migrations/np06-finance-reversal-race.sh
          echo FINANCE_NP01_PR111_PG17_COMBINED_PASS
