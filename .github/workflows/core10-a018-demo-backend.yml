name: CORE 10 - A018/A019 Executable Demo Backend

on:
  push:
    branches:
      - "feature/c10-a018-*"
    paths:
      - "internal/enterprise-sql/c10_a018_demo_backend.sql"
      - "internal/enterprise-sql/c10_a018_inventory_v1.sql"
      - "internal/enterprise-sql/c10_a020_business_setup_v1.sql"
      - "internal/enterprise-sql/c10_a020_industry_draft_v2.sql"
      - "tests/c10_a020_industry_draft_v2_e2e.sql"
      - "tests/c10_a018_demo_seed.sql"
      - "tests/c10_a018_demo_e2e.sql"
      - "tests/c10_a018_inventory_e2e.sql"
      - "tests/c10_a020_business_setup_e2e.sql"
      - ".github/workflows/core10-a018-demo-backend.yml"
  pull_request:
    paths:
      - "internal/enterprise-sql/c10_a018_demo_backend.sql"
      - "internal/enterprise-sql/c10_a018_inventory_v1.sql"
      - "internal/enterprise-sql/c10_a020_business_setup_v1.sql"
      - "internal/enterprise-sql/c10_a020_industry_draft_v2.sql"
      - "tests/c10_a020_industry_draft_v2_e2e.sql"
      - "tests/c10_a018_demo_seed.sql"
      - "tests/c10_a018_demo_e2e.sql"
      - "tests/c10_a018_inventory_e2e.sql"
      - "tests/c10_a020_business_setup_e2e.sql"
      - ".github/workflows/core10-a018-demo-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-demo-postgres:
    name: Isolated PostgreSQL 17 demo roles and workflow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo_only
          POSTGRES_DB: core10_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: core10_demo
      PGUSER: postgres
      PGPASSWORD: demo_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create disposable database roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
      - name: Build real relational demo backend and RLS
        run: psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_demo_backend.sql
      - name: Seed two independent tenants and nine demo identities
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
      - name: Install isolated inventory balance and transfer integrity engine
        run: psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_inventory_v1.sql
      - name: Run transactional provisioning, permission, stock and reporting E2E
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_e2e.sql
      - name: Install tenant-scoped Quick and Advanced setup prototype
        run: psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a020_business_setup_v1.sql
      - name: Run atomic inventory and tenant isolation E2E
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a018_inventory_e2e.sql
      - name: Run Quick and Advanced setup and 303-site E2E
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a020_business_setup_e2e.sql
      - name: Install ten-industry draft provisioning extension
        run: psql -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a020_industry_draft_v2.sql
      - name: Run ten-industry tenant-isolation and idempotency E2E
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a020_industry_draft_v2_e2e.sql
