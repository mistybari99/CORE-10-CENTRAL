name: CORE10 PACK-02 setup readback and workspaces
on:
  push:
    branches: ['claude/core10-pack02-*', 'feature/c10-pack02-claude-*']
  pull_request:
    paths:
      - 'core10-pack02-*'
      - 'internal/enterprise-sql/c10_pack02_*'
      - 'internal/enterprise-sql/c10_build01_access_integration_v1.sql'
      - 'internal/enterprise-sql/c10_a044_control_settings_v1.sql'
      - 'internal/enterprise-sql/c10_a048_inventory_commands_v1.sql'
      - 'internal/enterprise-sql/c10_a049_operation_workflow_v1.sql'
      - 'internal/enterprise-sql/c10_a050_owner_portfolio_v1.sql'
      - 'tests/pack02/**'
      - 'docs/development/PACK02_*'
      - '.github/workflows/core10-pack02-workspace-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, regression, controls, scale, portfolio, agreement, concurrency]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pack02_disposable_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: pack02_disposable_only
      CORE10_PACK02_DISPOSABLE_ACK: I_CONFIRM_PACK02_DISPOSABLE
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash tests/pack02/run-sql.sh '${{ matrix.suite }}'
  app-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pack02_disposable_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: pack02_disposable_only
      CORE10_PACK02_DISPOSABLE_ACK: I_CONFIRM_PACK02_DISPOSABLE
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pack02-pw"
          cd "$RUNNER_TEMP/pack02-pw"
          npm init -y >/dev/null
          npm install --save-dev playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pack02-pw/node_modules" >> "$GITHUB_ENV"
      - name: Browser host journey over real disposable SQL
        run: bash tests/pack02/run-sql.sh app
  client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Client projection contract
        run: |
          node --check core10-pack02-workspace.js
          node --check core10-pack02-controls.js
          node --check core10-pack02-signed.js
          node --check core10-pack02-app.js
          node --test tests/pack02/*.test.cjs
      - name: Static safety
        run: |
          ! grep -nE '(service_role|sb_secret_|innerHTML|eval\(|new Function)' core10-pack02-workspace.js core10-pack02-controls.js core10-pack02-signed.js core10-pack02-app.js
          ! grep -niE '(CREATE TABLE|INSERT INTO|UPDATE c10_demo|DELETE FROM|GRANT .* ON c10_demo\.)' internal/enterprise-sql/c10_pack02_workspace_v1.sql internal/enterprise-sql/c10_pack02_controls_v1.sql
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pack02-pw"
          cd "$RUNNER_TEMP/pack02-pw"
          npm init -y >/dev/null
          npm install --save-dev playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pack02-pw/node_modules" >> "$GITHUB_ENV"
      - name: Browser 390px / 1440px
        env:
          PACK02_SCREENSHOT_DIR: ${{ runner.temp }}/pack02-shots
        run: node tests/pack02/workspace-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack02-workspace-screenshots
          path: ${{ runner.temp }}/pack02-shots
          if-no-files-found: ignore
