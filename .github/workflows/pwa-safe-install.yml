name: PWA Safe Offline Install
on:
  pull_request:
    paths:
      - 'sw.js'
      - 'tests/sw-safe-install-smoke.js'
      - '.github/workflows/pwa-safe-install.yml'
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'tests/sw-safe-install-smoke.js'
      - '.github/workflows/pwa-safe-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sw-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sw.js
      - run: node tests/sw-safe-install-smoke.js
