name: CORE10 Frozen Import Provenance + Current Navigation 56/56 Local/Live (NO DEPLOY)
on:
  pull_request:
    branches: ["ccr-15ed11dd-n3hw5h"]
    paths:
      - "apps/central/**"
      - "docs/coordination/CENTRAL_SHELL_IMPORT_20261122.json"
      - "tests/core10-central-shell-provenance.test.js"
      - "tests/core10-central-sales-signed.test.cjs"
      - "tests/core10-central-stock-signed.test.cjs"
      - "tests/core10-central-mobile-nav.test.cjs"
      - "tests/core10-central-signed-context.test.cjs"
      - "tests/core10-live-legacy-guard.test.js"
      - ".github/workflows/core10-central-shell-import-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-build-provenance-local-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned preview and draft source ancestry for local deterministic builder
        run: |
          git fetch --no-tags origin refs/heads/preview/core10-central-level2:refs/remotes/origin/preview/core10-central-level2
          git fetch --no-tags origin refs/pull/109/head:refs/remotes/origin/pr109-head refs/pull/112/head:refs/remotes/origin/pr112-head
          git cat-file -e e9dd90d2c1616711378f657c4e5e0ce08e0d9db9^{commit}
      - name: Verify the exact §7b.3 frozen import in its historical worktree (no test relaxation)
        run: |
          git worktree add --detach "$RUNNER_TEMP/core10-shell-import-baseline" 4345b6e4aa7ee593a455ee29dceccf55d61ade7f
          node "$RUNNER_TEMP/core10-shell-import-baseline/apps/central/build.mjs"
          node --test "$RUNNER_TEMP/core10-shell-import-baseline/tests/core10-central-shell-provenance.test.js"
      - name: Current shell keeps original verifier and pinned backend inputs
        run: node --test --test-name-pattern="§7b.3 (only|build input)" tests/core10-central-shell-provenance.test.js
      - name: No retired IMG-ERP backend or config in CURRENT shipped shell or modules
        run: |
          node --test tests/core10-live-legacy-guard.test.js
          node --test tests/core10-legacy-move-integrity.test.js
      - name: Build CURRENT candidate Worker deterministically (NO deploy)
        run: |
          node apps/central/build.mjs
          sha256sum apps/central/dist/worker.mjs
          sha256sum apps/central/dist/worker.mjs > "$RUNNER_TEMP/core10-verified-worker.sha256"
      - name: Verify CURRENT site has only declared changes and bundle contains exact UI assets
        run: node --test tests/core10-central-shell-provenance.test.js
      - name: Signed Sales host lifecycle and exact canonical source pins
        run: node --test tests/core10-central-sales-signed.test.cjs
      - name: Signed Stock regression in same release candidate job
        run: node --test tests/core10-central-stock-signed.test.cjs
      - name: Install pinned Chromium outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/core10-playwright"
          cd "$RUNNER_TEMP/core10-playwright"
          npm init -y >/dev/null
          npm install -D playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/core10-playwright/node_modules" >> "$GITHUB_ENV"
      - name: NEW bilingual mobile and desktop route navigation browser regression
        run: node --test tests/core10-central-mobile-nav.test.cjs
      - name: Signed shell context adversarial browser tests
        run: node --test tests/core10-central-signed-context.test.cjs
      - name: Canonical 56/56 local browser checks, full suite unchanged
        run: node apps/central/verify.cjs
      - name: Canonical 56/56 public Worker checks, NO deploy
        env:
          REVIEW_BASE: https://core10-central.mistybari99.workers.dev
        run: node apps/central/verify.cjs
      - name: Package exact locally tested Worker and provenance (NO deploy)
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha256sum -c "$RUNNER_TEMP/core10-verified-worker.sha256"
          mkdir -p "$RUNNER_TEMP/core10-release-candidate"
          cp apps/central/dist/worker.mjs "$RUNNER_TEMP/core10-release-candidate/worker.mjs"
          cd "$RUNNER_TEMP/core10-release-candidate"
          sha256sum worker.mjs > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf 'checkout_commit=%s\ncheckout_tree=%s\npr_head=%s\nworkflow_run=%s\nrun_attempt=%s\n' \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            "$PR_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > provenance.txt
          cat provenance.txt SHA256SUMS
      - name: Upload tested immutable release candidate (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: core10-worker-tested-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core10-release-candidate/
          if-no-files-found: error
          retention-days: 14
