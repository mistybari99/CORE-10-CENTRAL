name: CORE 10 - A035 Offline Replay and Conflict Security CI
on:
  push:
    branches: ["feature/c10-a035-*"]
    paths:
      - "scripts/c10_a035_offline_replay_v1.sql"
      - "tests/c10_a035_offline_e2e.sql"
      - "tests/api/core10-a035-offline-rest-e2e.js"
      - "offline/core10-offline-outbox-v1.js"
      - "tests/offline/core10-offline-outbox-v1.test.js"
      - ".github/workflows/core10-a035-offline-ci.yml"
  pull_request:
    paths:
      - "scripts/c10_a035_offline_replay_v1.sql"
      - "tests/c10_a035_offline_e2e.sql"
      - "tests/api/core10-a035-offline-rest-e2e.js"
      - "offline/core10-offline-outbox-v1.js"
      - "tests/offline/core10-offline-outbox-v1.test.js"
      - ".github/workflows/core10-a035-offline-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-replay-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_a035_offline_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_a035_offline_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: core10_a035_offline_ci
      PGUSER: postgres
      PGPASSWORD: demo_only
      CORE10_CI_JWT_SECRET: core10_ci_disposable_enterprise_hmac_2026_only_not_production
      CORE10_CI_REST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create authenticated and anonymous roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
      - name: Install isolated core inventory and offline replay engine
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/c10_a018_demo_backend.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/c10_a018_inventory_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/c10_a035_offline_replay_v1.sql
      - name: Test offline stock replay, conflict, ledger version, scope, revocation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/c10_a035_offline_e2e.sql
      - name: Test browser outbox contract and no automatic unsafe retry
        run: node --test tests/offline/core10-offline-outbox-v1.test.js
      - name: Start signed-JWT disposable PostgREST
        run: |
          docker run --rm -d --name core10-a035-pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:demo_only@127.0.0.1:5432/core10_a035_offline_ci" \
            -e PGRST_DB_SCHEMAS=c10_demo \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CORE10_CI_JWT_SECRET" \
            -e PGRST_JWT_AUD=authenticated \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 40); do
            code=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" != "000" ] && [ "$code" != "503" ]; then exit 0; fi
            sleep 1
          done
          docker logs core10-a035-pgrst
          exit 1
      - name: Signed HTTP offline owner/staff/tenant denial and idempotent concurrency
        run: node tests/api/core10-a035-offline-rest-e2e.js
      - name: Diagnostics
        if: failure()
        run: docker logs core10-a035-pgrst || true
