name: PaperOps isolated foundation
on:
  push:
    branches:
      - build/paperops-foundation-20261122
    paths:
      - 'modules/paperops/**'
      - 'core10-*.html'
      - 'core10-*.js'
      - 'tests/core10-root-config-boundary.test.cjs'
      - '.github/workflows/paperops-foundation.yml'
  pull_request:
    branches:
      - ccr-15ed11dd-n3hw5h
    paths:
      - 'modules/paperops/**'
      - 'core10-*.html'
      - 'core10-*.js'
      - 'tests/core10-root-config-boundary.test.cjs'
      - '.github/workflows/paperops-foundation.yml'
  workflow_dispatch:
jobs:
  paperops:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen forms SHA and provide parent-only ephemeral path compatibility
        run: |
          expected=f2cb1c5e09210496106ace1bf33ddc40d2d6df1d
          if [ -f legacy/islamia-erp/forms.js ]; then
            test "$(git hash-object legacy/islamia-erp/forms.js)" = "$expected"
          elif [ -f forms.js ]; then
            test "$(git hash-object forms.js)" = "$expected"
            mkdir -p legacy/islamia-erp
            ln -s ../../forms.js legacy/islamia-erp/forms.js
          else
            echo 'FROZEN_FORMS_SOURCE_MISSING' >&2
            exit 1
          fi
      - name: Reproduce all legacy form rule candidates without executing frozen code
        run: node modules/paperops/legacy-rule-extractor.cjs --check
      - name: Verify all 1246 original fields have preserved cadence and unapproved mapping status
        run: node modules/paperops/field-routing.cjs --check
      - name: Verify consecutive first three 50-field batches and mapped source warnings
        run: node modules/paperops/field-batch-audit.cjs --check
      - name: Classify field semantics and unresolved source rules without inventing mandatory paper
        run: node modules/paperops/field-semantic-triage.cjs --check
      - name: Recheck all first 150 source declarations against frozen original forms
        run: node modules/paperops/field-deep-source-recheck.cjs --check
      - name: Trace exactly 16 source show and six conditionally required branches
        run: node modules/paperops/source-conditional-recheck.cjs
      - name: Require 11 source backed open gaps after full first 150 recheck
        run: node modules/paperops/field-functional-gap-audit.cjs
      - name: Verify previously missed dynamic R-01 cash, goods and fridge warning branches
        run: node modules/paperops/r01-hidden-source-audit.cjs
      - name: Enforce old-field to new-field and blocker trace, no false parity claims
        run: node modules/paperops/paper-parity-audit.cjs
      - name: Run eight synthetic paper-day scenarios (counts, routing, all drafts)
        run: node modules/paperops/paper-pilot.cjs
      - name: Run isolated synthetic demo accounts, inventory, money and ERP-write denial
        run: node modules/paperops/paper-demo.cjs
      - name: Verify signed-source packaging and expense cashbook synthetic reconciliation
        run: node modules/paperops/source-books-demo.cjs
      - name: Verify no-write source-to-CORE10 Stock and Money port handoff intents
        run: node modules/paperops/source-port-handoff-demo.cjs
      - name: Verify 7 scoped finance/packaging posting proposals are non-postable and replay-safe
        run: node modules/paperops/source-books-posting-demo.cjs
      - name: PaperOps contract, safety and preservation tests
        run: node --test modules/paperops/tests/*.test.cjs
      - name: Verify root CORE10 page load order and signed-session adapter (Node 22)
        run: node --test tests/core10-root-config-boundary.test.cjs
      - name: Run unmodified pinned canonical cross-module guard (mandatory)
        run: |
          expected=c059a34b65a83d25fb94f19ae2f55f93b954b090
          guard=tests/core10-live-legacy-guard.test.js
          if [ ! -f "$guard" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/ccr-15ed11dd-n3hw5h
            mkdir -p tests
            git show "FETCH_HEAD:$guard" > "$guard"
          fi
          test "$(git hash-object "$guard")" = "$expected"
          node --test "$guard"
