name: CORE10 A025 Simulation Engine (isolated draft)
# DRAFT / ISOLATED / SYNTHETIC DATA. Runs only on A025 paths. No secrets, no deployment, no production DB.
on:
  pull_request:
    paths:
      - "modules/simulation/**"
      - "tests/c10_a025/**"
      - "docs/development/C10_A025_*"
      - ".github/workflows/core10-a025-simulation-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a025-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Engine, analysis, scenario, security, golden (node 22 + independent python reference)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Print exact commit under test
        run: echo "HEAD=$(git rev-parse HEAD) BASE=$(git merge-base origin/main HEAD)" | tee "$GITHUB_STEP_SUMMARY"
      - name: Freshness gates (bundle, registry lock, coverage doc, golden reference)
        run: |
          node modules/simulation/tools/build-bundle.js --check
          node modules/simulation/tools/registry-lock.js --check
          node modules/simulation/tools/gen-coverage-doc.js --check
          python3 tests/c10_a025/golden_reference.py --check
      - name: Unit, property, journey, analysis, scenario, parity, bench, guard tests
        run: |
          for t in golden kernel registry models analysis scenario parity bench guard; do node tests/c10_a025/$t.test.js; done
      - name: Upload measured benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10-a025-bench
          path: tests/c10_a025/bench-result.json
          if-no-files-found: ignore
          retention-days: 14
  postgres17:
    name: Disposable PostgreSQL 17 — RLS, RPC grants, concurrency, immutability, no side effects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Server version (must be 17)
        run: psql -d postgres -Atc "show server_version" | tee "$GITHUB_STEP_SUMMARY"
      - name: Persistence + security matrix on throwaway database
        run: node tests/c10_a025/persistence.test.js
      - name: Upload DB timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10-a025-pg
          path: tests/c10_a025/pg-bench-result.json
          if-no-files-found: ignore
          retention-days: 14
  browser:
    name: Chromium E2E — Lab + Quick Simulation at 390 / 768 / 1440 px
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser flows (synthetic, localhost only)
        run: node tests/c10_a025/browser.test.js
      - name: Attach screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10-a025-screenshots
          path: tests/c10_a025/artifacts/
          if-no-files-found: ignore
          retention-days: 14
