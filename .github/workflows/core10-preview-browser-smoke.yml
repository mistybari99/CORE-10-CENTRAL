name: CORE10 Preview V1 public browser UX
on:
  push:
    branches: [preview/c10-integrated-20261111-v1]
    paths:
      - 'tests/e2e/core10-preview-v1-browser.cjs'
      - '.github/workflows/core10-preview-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/core10-preview-playwright" && cd "$RUNNER_TEMP/core10-preview-playwright"
          npm init -y >/dev/null
          npm install -D playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/core10-preview-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Interactive public preview browser smoke
        run: node tests/e2e/core10-preview-v1-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core10-preview-v1-mobile-desktop-screenshots
          path: /tmp/core10-preview-*.png
          if-no-files-found: ignore
