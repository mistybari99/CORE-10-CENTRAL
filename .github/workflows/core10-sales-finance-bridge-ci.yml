name: CORE10 Sales -> Finance -> AR real bridge PG17
on:
  push:
    branches: [build/chatgpt-sales-finance-bridge-20261121]
  pull_request:
    paths:
      - "internal/migrations/0305*"
      - "internal/migrations/0406*"
      - "internal/migrations/0407*"
      - "tests/migrations/np06-sales-finance-bridge*"
      - ".github/workflows/core10-sales-finance-bridge-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: bridge_disposable
          POSTGRES_DB: core10_np03b_ci_bridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: bridge_disposable
      PGDATABASE: core10_np03b_ci_bridge
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Disposable Auth roles only - never hosted data
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
          END \$\$;"
      - name: Enforce original Sales 0300-0304 migration checksums
        run: |
          sha256sum -c tests/np03b/0300-0304.sha256
          node --test tests/migrations/migration-contract.test.js
      - name: Apply canonical Sales Finance ARAP migrations in numeric order
        run: |
          internal/migrations/run.sh up
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/control-registry-check.sql
          bash tests/migrations/control-registry-evidence.sh
      - name: Canonical validated Sales invoice -> posted Money -> actual AR open item
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np06-sales-finance-bridge-e2e.sql
      - name: Never mutate hosted database - local rollback and idempotent reapply
        run: |
          bash tests/migrations/run-updownup.sh
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/np06-sales-finance-bridge-e2e.sql
