# C10-A031 — enterprise physical stocktake backend, isolated PostgreSQL 17 only.
# No Supabase staging or production access; no customer data; no service keys.
name: CORE10 A031 Physical Stocktake, Approval and Stale-safe Adjustment CI
on:
  push:
    branches: ['feature/c10-a018-*']
    paths:
      - 'internal/enterprise-sql/c10_a018_demo_backend.sql'
      - 'internal/enterprise-sql/c10_a018_inventory_v1.sql'
      - 'internal/enterprise-sql/c10_a031_stocktake_v1.sql'
      - 'tests/c10_a018_demo_seed.sql'
      - 'tests/c10_a031_stocktake_e2e.sql'
      - 'tests/api/core10-stocktake-rest-e2e.js'
      - '.github/workflows/core10-a031-stocktake-ci.yml'
  pull_request:
    paths:
      - 'internal/enterprise-sql/c10_a018_demo_backend.sql'
      - 'internal/enterprise-sql/c10_a018_inventory_v1.sql'
      - 'internal/enterprise-sql/c10_a031_stocktake_v1.sql'
      - 'tests/c10_a018_demo_seed.sql'
      - 'tests/c10_a031_stocktake_e2e.sql'
      - 'tests/api/core10-stocktake-rest-e2e.js'
      - '.github/workflows/core10-a031-stocktake-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stocktake-transaction-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_stocktake_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_stocktake_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: core10_stocktake_disposable
      PGUSER: postgres
      PGPASSWORD: ci_only_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up disposable PostgreSQL authenticated/anon roles
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
      - name: Install existing CORE 10 neutral tenant and stock engine
        run: |
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_demo_backend.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_inventory_v1.sql
      - name: Install physical stocktake, owner approval, audit and stale-safe posting
        run: psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a031_stocktake_v1.sql
      - name: Execute stocktake end-to-end test against isolated database
        run: psql -X -v ON_ERROR_STOP=1 -f tests/c10_a031_stocktake_e2e.sql
      - name: Start disposable signed-HMAC PostgREST HTTP API (never real Supabase)
        env:
          CORE10_CI_JWT_SECRET: core10_disposable_stocktake_ci_signer_only_2026_not_production
        run: |
          docker run --rm -d --name core10-stocktake-pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:ci_only_disposable@127.0.0.1:5432/core10_stocktake_disposable" \
            -e PGRST_DB_SCHEMAS=c10_demo \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CORE10_CI_JWT_SECRET" \
            -e PGRST_JWT_AUD=authenticated \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" != 000 ]; then exit 0; fi
            sleep 1
          done
          docker logs core10-stocktake-pgrst
          exit 1
      - name: Run signed HMAC JWT/PostgREST stocktake API E2E with concurrent retries
        env:
          CORE10_CI_JWT_SECRET: core10_disposable_stocktake_ci_signer_only_2026_not_production
          CORE10_CI_REST_URL: http://127.0.0.1:3000
        run: node tests/api/core10-stocktake-rest-e2e.js
      - name: PostgREST diagnostics on failure
        if: failure()
        run: docker logs core10-stocktake-pgrst || true
      - name: Print certification boundary
        run: echo 'PASS disposable PostgreSQL17 + signed HMAC PostgREST only, NOT real Supabase GoTrue/staging/production.'

