name: CORE10 NP11B isolated integration worker
on:
  pull_request:
    paths:
      - 'server/integrations/**'
      - 'tests/server-integrations/**'
      - '.github/workflows/core10-np11b-worker-ci.yml'
permissions:
  contents: read
jobs:
  synthetic-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/server-integrations/adapters.test.js
      - run: node --test tests/server-integrations/delivery-regression.test.cjs tests/server-integrations/leased-dry-run.test.cjs
  disposable-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: np11b_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d np11b_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: np11b_fixture
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/server-integrations/lease-fixture.sql -f server/integrations/sql/lease-fence.candidate.sql -f tests/server-integrations/lease-fence.test.sql
  canonical-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: np11b_canonical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d np11b_canonical"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: np11b_canonical
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
      - run: bash internal/migrations/run.sh up
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/server-integrations/canonical-binding.test.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/server-integrations/admission.test.sql
      - run: bash tests/server-integrations/admission-race.sh
