name: CORE 10 - Owner Inbox RPC Security CI
on:
  pull_request:
    paths:
      - "CORE10_OWNER_INBOX_RPC_CANDIDATE.sql"
      - "tests/sql/core10-owner-inbox-*.sql"
      - "tests/api/core10-owner-inbox-rest-smoke.js"
      - ".github/workflows/core10-owner-inbox-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-rpc-gates:
    name: Isolated Owner/Staff/Anon/Revoked SQL RPC Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_owner_inbox_ci
          POSTGRES_USER: core10
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core10 -d core10_owner_inbox_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: core10_owner_inbox_ci
      PGUSER: core10
      PGPASSWORD: ci_disposable_only
      CORE10_CI_JWT_SECRET: core10_ci_disposable_hmac_secret_2026_only_please
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client if absent
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Create isolated two-business mapping schema and scenarios
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/core10-approval-mapping-fixture.sql
      - name: Add owner, staff, revoked roles and approval statuses
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/core10-owner-inbox-fixture.sql
      - name: Compile candidate RPC and apply explicit grants in CI only
        run: psql -X -v ON_ERROR_STOP=1 -f CORE10_OWNER_INBOX_RPC_CANDIDATE.sql
      - name: Verify server-side Owner/Business/Staff/Anon/Revoked security contract
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/core10-owner-inbox-assertions.sql
      - name: Launch disposable PostgREST with signed JWT authentication
        run: |
          docker run --rm -d --name core10-ci-postgrest --network host \
            -e PGRST_DB_URI="postgres://core10:ci_disposable_only@127.0.0.1:5432/core10_owner_inbox_ci" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CORE10_CI_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          docker logs core10-ci-postgrest
          exit 1
      - name: Test real HTTP RPC using signed Owner Staff Revoked Anonymous JWTs
        run: node tests/api/core10-owner-inbox-rest-smoke.js
      - name: PostgREST container diagnostics on failure
        if: failure()
        run: docker logs core10-ci-postgrest || true
