# Disposable signed-JWT PostgREST gateway checks (no production connections).
name: CORE 10 - Owner Inbox REST Security CI
on:
  pull_request:
    paths:
      - "CORE10_OWNER_INBOX_RPC_CANDIDATE.sql"
      - "tests/api/core10-owner-inbox-rest-smoke.js"
      - "tests/sql/core10-owner-inbox-fixture.sql"
      - ".github/workflows/core10-owner-inbox-rest-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-rest-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_owner_inbox_ci
          POSTGRES_USER: core10
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core10 -d core10_owner_inbox_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: core10_owner_inbox_ci
      PGUSER: core10
      PGPASSWORD: ci_disposable_only
      CORE10_CI_JWT_SECRET: core10_ci_disposable_hmac_secret_2026_only_please
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Prepare isolated two-business auth fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/core10-approval-mapping-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/core10-owner-inbox-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f CORE10_OWNER_INBOX_RPC_CANDIDATE.sql
      - name: Start disposable PostgREST HTTP gateway
        run: |
          docker run --rm -d --name core10-ci-pgrst --network host \
            -e PGRST_DB_URI="postgres://core10:ci_disposable_only@127.0.0.1:5432/core10_owner_inbox_ci" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CORE10_CI_JWT_SECRET" \
            -e PGRST_JWT_AUD=authenticated \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 30); do
            if curl -s --max-time 2 -o /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          docker logs core10-ci-pgrst
          exit 1
      - name: Verify signed-JWT HTTP RPC security matrix
        run: node tests/api/core10-owner-inbox-rest-smoke.js
      - name: Diagnostics if failed
        if: failure()
        run: docker logs core10-ci-pgrst || true
