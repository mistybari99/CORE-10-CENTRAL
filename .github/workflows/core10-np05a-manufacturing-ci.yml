name: core10-np05a-manufacturing-ci
on:
  push:
    branches: [build/codex-np05a-sweets]
  pull_request:
    paths:
      - 'internal/migrations/**'
      - 'modules/manufacturing/**'
      - 'internal/candidates/c10_mfg_finished_lot_candidate.up.sql'
      - 'tests/np05a/**'
      - '.github/workflows/core10-np05a-manufacturing-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manufacturing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: np05a_disposable_only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: np05a_disposable_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Disposable API roles
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Static migration and signed context client contracts
        run: |
          sha256sum -c tests/np05a/0500-0504.sha256
          node --test tests/migrations/migration-contract.test.js tests/np05a/client.test.mjs
      - name: PostgreSQL 17 all migrations up down up
        run: bash tests/migrations/run-updownup.sh
      - name: Manufacturing lifecycle and disabled Control negatives
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/manufacturing-e2e.sql
      - name: Material requirements and immutable source handoff
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/material-handoff-e2e.sql
      - name: Reason-coded material waste and consumption bounds
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/material-waste-e2e.sql
      - name: Immutable substitution drafts and non-posting preview
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/substitution-e2e.sql
      - name: Canonical Control registry and evidence
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/control-registry-check.sql
          bash tests/migrations/control-registry-evidence.sh
      - name: Real canonical Master original and alternative validation
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/canonical-master-e2e.sql
          psql -X -At -c "SELECT pg_get_functiondef(oid)||';' FROM pg_proc WHERE oid IN ('core10._mfg_master_check_v1(bigint)'::regprocedure,'core10._mfg_substitution_check_v1(bigint)'::regprocedure)" > /tmp/np05a-canonical-hooks.sql
      - name: T01.04 finished lot candidate on separate disposable PostgreSQL
        run: |
          createdb core10_finished_lot_candidate
          export PGDATABASE=core10_finished_lot_candidate
          internal/migrations/run.sh up
          psql -X -1 -v ON_ERROR_STOP=1 -f internal/candidates/c10_mfg_finished_lot_candidate.up.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/migrations/control-registry-check.sql
          psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/finished-lot-candidate-e2e.sql
      - name: Real two-session replay and safe rollback with history
        run: bash tests/np05a/concurrency.sh
      - name: Lock-wait Control change and immediate revocation
        run: bash tests/np05a/lock-wait.sh
      - name: Concurrent material waste cap and waiting revocation
        run: bash tests/np05a/waste-race.sh
      - name: Fictional alternative item for browser draft proposals
        run: psql -X -q -v ON_ERROR_STOP=1 -f tests/np05a/substitution-browser-seed.sql
      - name: Concurrent substitution definitions and waiting revocation
        run: bash tests/np05a/substitution-race.sh
      - name: Finance history guard at the exact Finance rollback boundary
        run: bash tests/np05a/finance-rollback-boundary.sh
      - name: Install browser
        run: |
          npm install --prefix /tmp/np05a-browser playwright@1.63.0
          /tmp/np05a-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser at 390 and 1440 with disposable SQL
        env: {NODE_PATH: /tmp/np05a-browser/node_modules, MFG_SHOTS: np05a-shots}
        run: node tests/np05a/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: np05a-evidence, path: np05a-shots, if-no-files-found: ignore}
      - name: Restore production hooks and seed canonical Master browser scenario
        run: bash tests/np05a/canonical-master-live.sh
      - name: Canonical Master concurrency and fresh authorization
        run: bash tests/np05a/canonical-master-race.sh
      - name: Canonical Master bilingual browser at 390 and 1440
        env: {NODE_PATH: /tmp/np05a-browser/node_modules, MFG_SHOTS: np05a-master-shots}
        run: node tests/np05a/master-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: np05a-master-evidence, path: np05a-master-shots, if-no-files-found: ignore}
