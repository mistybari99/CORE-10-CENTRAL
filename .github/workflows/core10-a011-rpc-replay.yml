name: CORE10 A011 RPC Replay Security
on:
  pull_request:
    paths:
      - 'security/c10_a011_rpc_replay_candidate.sql'
      - 'security/c10_a011_rpc_replay_ROLLBACK.sql'
      - 'tests/c10_a011_replay_fixture.sql'
      - 'tests/c10_a011_replay_tests.mjs'
      - '.github/workflows/core10-a011-rpc-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-real-function-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SQL client and syntax
        run: |
          psql --version
          node --check tests/c10_a011_replay_tests.mjs
      - name: Exact RPC replay, scope and rollback contracts
        run: node tests/c10_a011_replay_tests.mjs
