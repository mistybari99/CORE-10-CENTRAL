# C10-A051 Workforce, Attendance, Leave & Payroll — isolated PostgreSQL 17 + signed-HMAC PostgREST + Node + Chromium.
# No Supabase staging/production access, no real staff/payroll data, no service keys. NOT a GoTrue verification.
name: CORE10 A051 Workforce Attendance Leave Payroll CI
on:
  push:
    branches: ['claude/c10-a051-*']
  pull_request:
    paths:
      - 'internal/enterprise-sql/c10_a051_workforce_*.sql'
      - 'tests/c10_a051_*'
      - 'tests/api/core10-a051-*'
      - 'tests/e2e/core10-a051-*'
      - 'core10-workforce-*'
      - 'docs/architecture/C10_A051_*.md'
      - '.github/workflows/core10-a051-workforce-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workforce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_a051_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_a051_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: core10_a051_disposable
      PGUSER: postgres
      PGPASSWORD: ci_only_disposable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable authenticated/anon roles
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
      - name: Existing A018 tenant/business/site/membership baseline + synthetic seed
        run: |
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_demo_backend.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
      - name: Install A051 workforce SQL (core, attendance/leave, payroll, reads) and synthetic personas
        run: |
          for f in core attendance_leave payroll reads; do
            psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a051_workforce_${f}_v1.sql
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/c10_a051_workforce_seed.sql
      - name: A051 SQL end-to-end (roles, tenants, calculations, locks, amendments, audit, reports)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/c10_a051_workforce_e2e.sql
      - name: Real parallel-session concurrency and idempotency
        run: bash tests/c10_a051_workforce_concurrency.sh
      - name: Client/UI contract (allow-list == SQL signatures, no unsafe sinks)
        run: node tests/c10_a051_workforce_client.test.js
      - name: Start disposable signed-HMAC PostgREST (never real Supabase)
        env:
          CORE10_CI_JWT_SECRET: core10_disposable_a051_ci_signer_only_2026_not_production
        run: |
          docker run --rm -d --name core10-a051-pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:ci_only_disposable@127.0.0.1:5432/core10_a051_disposable" \
            -e PGRST_DB_SCHEMAS=c10_demo \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CORE10_CI_JWT_SECRET" \
            -e PGRST_JWT_AUD=authenticated \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" != 000 ]; then exit 0; fi
            sleep 1
          done
          docker logs core10-a051-pgrst
          exit 1
      - name: Signed-HMAC HTTP API end-to-end (claims never grant authority)
        env:
          CORE10_CI_JWT_SECRET: core10_disposable_a051_ci_signer_only_2026_not_production
          CORE10_CI_REST_URL: http://127.0.0.1:3000
        run: node tests/api/core10-a051-workforce-rest-e2e.js
      - name: PostgREST diagnostics on failure
        if: failure()
        run: docker logs core10-a051-pgrst || true
      - name: Install pinned Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/core10-playwright" && cd "$RUNNER_TEMP/core10-playwright"
          npm init -y >/dev/null
          npm install -D playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/core10-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Mobile 390px and desktop 1440px real-DOM UI (synthetic signed fixture)
        run: node tests/e2e/core10-a051-workforce-browser.js
      - name: Certification boundary
        run: echo 'PASS disposable PostgreSQL17 + signed-HMAC PostgREST + synthetic browser fixture only. NOT real GoTrue, NOT staging, NOT production.'
