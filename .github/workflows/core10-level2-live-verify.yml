name: CORE10 Level2 deployed Worker 56-check live gate
on:
  push:
    branches: [preview/core10-central-level2]
    paths:
      - '.github/workflows/core10-level2-live-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real Chromium for mobile and desktop
        run: |
          mkdir -p "$RUNNER_TEMP/core10-live-playwright"
          cd "$RUNNER_TEMP/core10-live-playwright"
          npm init -y >/dev/null
          npm install --save-dev playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/core10-live-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Rebuild and verify exact released candidate artifact checksum
        run: |
          node preview/core10-central-owner-app/build.mjs
          echo "ba530d45179f9ea146bccb0a04899213a3e396adf7fe6030b28eebf938a5f4b2  preview/core10-central-owner-app/dist/worker.mjs" | sha256sum -c -
          node --check preview/core10-central-owner-app/dist/worker.mjs
      - name: FULL deployed live Worker verification — all 56 must PASS
        env:
          REVIEW_BASE: https://core10-central.mistybari99.workers.dev
        run: node preview/core10-central-owner-app/verify.cjs
