name: CORE10 Build05 Paint Pack tests
on:
  pull_request:
    paths:
      - 'internal/industry-packs/paint-hardware-v1/**'
      - '.github/workflows/c10-build05-paint-pack.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test internal/industry-packs/paint-hardware-v1/core.test.mjs
