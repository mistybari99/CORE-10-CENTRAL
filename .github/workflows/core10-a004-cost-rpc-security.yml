name: CORE 10 - A004 Islamia Costing RPC Security Gate

on:
  push:
    branches:
      - "security/c10-a004-*"
    paths:
      - "security/c10_a004_cost_rpc_acl_candidate.sql"
      - "tests/c10_a004_cost_rpc_fixture.sql"
      - "tests/c10_a004_cost_rpc_before.sql"
      - "tests/c10_a004_cost_rpc_after.sql"
      - ".github/workflows/core10-a004-cost-rpc-security.yml"
  pull_request:
    paths:
      - "security/c10_a004_cost_rpc_acl_candidate.sql"
      - "tests/c10_a004_cost_rpc_fixture.sql"
      - "tests/c10_a004_cost_rpc_before.sql"
      - "tests/c10_a004_cost_rpc_after.sql"
      - ".github/workflows/core10-a004-cost-rpc-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-cost-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: core10_a004
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_a004"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: core10_a004
      PGUSER: postgres
      PGPASSWORD: synthetic_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create disposable roles and original helper-shape fixture
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN"
          psql -v ON_ERROR_STOP=1 -f tests/c10_a004_cost_rpc_fixture.sql
      - name: Confirm the synthetic pre-patch exposure in a rollback-only transaction
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a004_cost_rpc_before.sql
      - name: Apply restricted candidate ACL ONLY to disposable test database
        run: psql -v ON_ERROR_STOP=1 -f security/c10_a004_cost_rpc_acl_candidate.sql
      - name: Negative-test anon/staff direct calls and prove owner/service chain remains usable
        run: psql -v ON_ERROR_STOP=1 -f tests/c10_a004_cost_rpc_after.sql
