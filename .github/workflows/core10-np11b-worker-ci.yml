name: CORE10 NP11B isolated integration worker
on:
  pull_request:
    paths:
      - 'server/integrations/**'
      - 'tests/server-integrations/**'
      - '.github/workflows/core10-np11b-worker-ci.yml'
permissions:
  contents: read
jobs:
  synthetic-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/server-integrations/adapters.test.js
      - run: node --test tests/server-integrations/delivery-regression.test.cjs
