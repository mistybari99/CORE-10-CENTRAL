name: CORE10 signed Stock workbench regression
on:
  pull_request:
    branches: ["ccr-15ed11dd-n3hw5h"]
    paths:
      - "apps/central/site/view/stock-signed.js"
      - "tests/core10-central-stock-signed.test.cjs"
      - ".github/workflows/core10-central-stock-signed-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check apps/central/site/view/stock-signed.js
      - run: node --test tests/core10-central-stock-signed.test.cjs
