name: PaperOps isolated evidence hardening
on:
  pull_request:
    branches: [build/paperops-trunk-w02-review-20261124]
    paths:
      - 'modules/paperops/**'
      - '.github/workflows/paperops-evidence-hardening.yml'
permissions:
  contents: read
jobs:
  exact-source-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck 1000 + 246 ownership and source assertions
        run: |
          for check in legacy-rule-extractor field-routing field-batch-audit field-deep-source-recheck field-semantic-triage; do
            node "modules/paperops/$check.cjs" --check
          done
          audit=modules/paperops/field-review/codex-1000
          node "$audit/summary.cjs" --complete
          node "$audit/completion-matrix.cjs" modules/paperops/field-review/chatgpt-246 --check
          node --experimental-test-isolation=none --test modules/paperops/tests/*.test.cjs "$audit"/audit*.test.cjs
      - name: Load exact legacy and shared safety guard pins
        run: git fetch --no-tags origin refs/pull/109/head:refs/remotes/origin/pr109-head refs/pull/112/head:refs/remotes/origin/pr112-head
      - name: Check frozen legacy and live isolation
        run: node --test tests/core10-file-classification.test.js tests/core10-legacy-move-integrity.test.js tests/core10-live-legacy-guard.test.js

  w02-signed-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: w02_disposable_local
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: w02_disposable_local
      CORE10_W02_DISPOSABLE: W02_LOCAL_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable signed W02 canonical Stock and Control review
        run: bash modules/paperops/tests/w02-signed/run.sh
  pg17-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Static migration contract
        run: node --test tests/migrations/migration-contract.test.js
      - name: Full up/down/up on isolated PostgreSQL 17
        run: bash tests/migrations/run-updownup.sh
