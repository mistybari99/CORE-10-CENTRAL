name: CORE 10 - AI Handoff and GitHub-First Protocol

on:
  push:
    branches:
      - "security/c10-a004-*"
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs/development/**"
      - "tests/core10-agent-protocol-contract.js"
      - ".github/workflows/core10-agent-protocol.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs/development/**"
      - "tests/core10-agent-protocol-contract.js"
      - ".github/workflows/core10-agent-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert shared Claude and ChatGPT project protocol is versioned
        run: node tests/core10-agent-protocol-contract.js
