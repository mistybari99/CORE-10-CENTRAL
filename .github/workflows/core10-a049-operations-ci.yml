name: CORE10 A049 purchase sale workflow PG17
on:
  push:
    branches: ['claude/c10-a049-*']
    paths: ['internal/enterprise-sql/c10_a049_*','tests/c10_a049_*','core10-operational-flow*','.github/workflows/core10-a049-operations-ci.yml']
  pull_request:
    paths: ['internal/enterprise-sql/c10_a049_*','tests/c10_a049_*','core10-operational-flow*','.github/workflows/core10-a049-operations-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: core10_a048_ci_a049, POSTGRES_USER: postgres, POSTGRES_PASSWORD: demo_a049 }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_a048_ci_a049"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: core10_a048_ci_a049
      PGUSER: postgres
      PGPASSWORD: demo_a049
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Disposable canonical inventory and purchase sale module
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_demo_backend.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/c10_a018_demo_seed.sql
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a018_inventory_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a048_inventory_commands_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f internal/enterprise-sql/c10_a049_operation_workflow_v1.sql
      - name: Verify 2-business purchase to stock to sales & denied production/accounting paths
        run: psql -X -v ON_ERROR_STOP=1 -f tests/c10_a049_operation_workflow_e2e.sql
      - name: Validate signed operations UI client
        run: node tests/c10_a049_operation_client.test.js
      - name: Integrity boundary
        run: echo "A049 real isolated purchase/sale stock; production plan only, BOM/COGS/financial posting NOT certified."
