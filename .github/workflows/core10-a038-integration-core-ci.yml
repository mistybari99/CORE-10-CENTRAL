# CORE10 A038: Integration Ports core. DISPOSABLE PostgreSQL 17 ONLY. Never runs against IMG-ERP-SG.
name: CORE10 - A038 Integration Ports Core
on:
  push:
    branches:
      - "feature/c10-claude-integration-ports-*"
    paths:
      - "scripts/c10_a038_*.sql"
      - "tests/c10_a038_*.sql"
      - ".github/workflows/core10-a038-integration-core-ci.yml"
  pull_request:
    paths:
      - "scripts/c10_a038_*.sql"
      - "tests/c10_a038_*.sql"
      - ".github/workflows/core10-a038-integration-core-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-core:
    name: Ports OFF by default, consent/quiet/cap gates, idempotency, retry lease, webhooks, owner-only RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: core10_integration_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core10_integration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: demo_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create disposable API roles
        run: |
          psql -d core10_integration_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -d core10_integration_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
      - name: Build demo backend, seed, and the A038 integration core
        run: |
          for f in scripts/c10_a018_demo_backend.sql tests/c10_a018_demo_seed.sql scripts/c10_a038_integration_core_v1.sql; do
            echo ">> $f"; psql -X -d core10_integration_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Integration core end-to-end (SQL, RLS, gates)
        run: psql -X -d core10_integration_ci -v ON_ERROR_STOP=1 -f tests/c10_a038_integration_core_e2e.sql
